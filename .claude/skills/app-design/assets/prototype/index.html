<!doctype html>
<!--
  app-design prototype viewer. Copy assets/prototype/* to design/prototype/.
  Edit SCREENS and FLOWS below. Each screen is an HTML file (see screen-template.html) that reads
  ?state=, ?theme=, ?contrast= from its URL. Screenshot exact sizes by opening a screen file directly
  at the device viewport, or this viewer with ?screen=<id>&device=<id>&state=<s>&theme=<t>.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototype</title>
<link rel="stylesheet" href="../tokens/build/tokens.css">
<style>
  :root { color-scheme: light dark; --chrome-bg: #F3F3F5; --chrome-fg: #1B1C21; --chrome-muted: #5D6070; --chrome-line: #DADBE1; --chrome-accent: #1F55D6; }
  @media (prefers-color-scheme: dark) { :root { --chrome-bg: #121317; --chrome-fg: #EDEDF1; --chrome-muted: #A3A6B3; --chrome-line: #2A2C34; --chrome-accent: #6B9BFF; } }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI Variable", Roboto, system-ui, sans-serif; background: var(--chrome-bg); color: var(--chrome-fg); display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; }
  aside { border-right: 1px solid var(--chrome-line); padding: 16px; overflow: auto; }
  h1 { font-size: 15px; margin: 0 0 12px; }
  h2 { font-size: 12px; color: var(--chrome-muted); font-weight: 600; margin: 18px 0 6px; }
  button, select { font: inherit; color: inherit; background: transparent; border: 1px solid var(--chrome-line); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
  button[aria-pressed="true"], button[aria-current="true"] { border-color: var(--chrome-accent); color: var(--chrome-accent); }
  button:focus-visible, select:focus-visible { outline: 2px solid var(--chrome-accent); outline-offset: 2px; }
  .list { display: grid; gap: 4px; } .list button { text-align: left; border-color: transparent; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; }
  main { display: grid; grid-template-rows: auto 1fr; min-width: 0; }
  header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--chrome-line); }
  header .title { font-weight: 600; margin-right: auto; }
  .stage { display: grid; place-items: center; padding: 24px; overflow: auto; }
  .device { background: #000; padding: 10px; border-radius: 48px; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
  .device.desktop, .device.web { border-radius: 12px; padding: 0; background: var(--chrome-line); }
  iframe { display: block; border: 0; border-radius: 38px; background: #fff; }
  .device.desktop iframe, .device.web iframe { border-radius: 10px; }
  .note { color: var(--chrome-muted); font-size: 12px; margin-top: 12px; }
</style>
</head>
<body>
<aside>
  <h1>Prototype</h1>
  <h2>Flows</h2><div class="list" id="flows"></div>
  <h2>Screens</h2><div class="list" id="screens"></div>
  <p class="note">Keys: ← → step through the current flow.</p>
</aside>
<main>
  <header>
    <span class="title" id="title"></span>
    <select id="device" aria-label="Device"></select>
    <select id="state" aria-label="State"></select>
    <div class="row" role="group" aria-label="Appearance">
      <button id="light" aria-pressed="true">Light</button><button id="dark" aria-pressed="false">Dark</button>
      <button id="contrast" aria-pressed="false">Increased contrast</button>
    </div>
  </header>
  <div class="stage"><div class="device" id="frame"><iframe id="view" title="Screen"></iframe></div></div>
</main>
<script>
// ---- Edit these ---------------------------------------------------------------------------
const SCREENS = [
  { id: "today", title: "Today", file: "../screens/today.html", states: ["default", "empty", "loading", "error", "offline"] },
  { id: "habit", title: "Habit detail", file: "../screens/habit.html", states: ["default", "editing"] },
];
const FLOWS = [
  { id: "core", title: "Core loop: check off a habit", steps: ["today", "habit", "today"] },
];
const DEVICES = [
  { id: "iphone", title: "iPhone 393×852", w: 393, h: 852, kind: "phone" },
  { id: "iphone-max", title: "iPhone Pro Max 440×956", w: 440, h: 956, kind: "phone" },
  { id: "ipad", title: "iPad 11-inch 834×1194", w: 834, h: 1194, kind: "phone" },
  { id: "android", title: "Android compact 412×915", w: 412, h: 915, kind: "phone" },
  { id: "android-medium", title: "Android medium 700×840", w: 700, h: 840, kind: "phone" },
  { id: "web-390", title: "Web 390", w: 390, h: 844, kind: "web" },
  { id: "web-768", title: "Web 768", w: 768, h: 1024, kind: "web" },
  { id: "web-1024", title: "Web 1024", w: 1024, h: 768, kind: "web" },
  { id: "web-1440", title: "Web 1440", w: 1440, h: 900, kind: "web" },
  { id: "desktop-min", title: "Desktop window minimum 900×600", w: 900, h: 600, kind: "desktop" },
];
// --------------------------------------------------------------------------------------------
const q = new URLSearchParams(location.search);
const st = { screen: q.get("screen") || SCREENS[0].id, device: q.get("device") || DEVICES[0].id, state: q.get("state") || "default",
             theme: q.get("theme") || "light", contrast: q.get("contrast") || "standard", flow: q.get("flow") || null, step: 0 };
const $ = (id) => document.getElementById(id);
function render() {
  const s = SCREENS.find((x) => x.id === st.screen) || SCREENS[0];
  const d = DEVICES.find((x) => x.id === st.device) || DEVICES[0];
  if (!s.states.includes(st.state)) st.state = s.states[0];
  $("title").textContent = s.title;
  $("state").innerHTML = s.states.map((x) => `<option ${x === st.state ? "selected" : ""}>${x}</option>`).join("");
  $("device").innerHTML = DEVICES.map((x) => `<option value="${x.id}" ${x.id === d.id ? "selected" : ""}>${x.title}</option>`).join("");
  $("frame").className = "device " + d.kind;
  const v = $("view"); v.width = d.w; v.height = d.h;
  v.src = `${s.file}?state=${st.state}&theme=${st.theme}&contrast=${st.contrast}`;
  $("light").setAttribute("aria-pressed", st.theme === "light"); $("dark").setAttribute("aria-pressed", st.theme === "dark");
  $("contrast").setAttribute("aria-pressed", st.contrast === "more");
  $("screens").innerHTML = SCREENS.map((x) => `<button data-s="${x.id}" aria-current="${x.id === s.id}">${x.title}</button>`).join("");
  $("flows").innerHTML = FLOWS.map((f) => `<button data-f="${f.id}" aria-current="${f.id === st.flow}">${f.title}</button>`).join("");
  const p = new URLSearchParams({ screen: st.screen, device: st.device, state: st.state, theme: st.theme, contrast: st.contrast });
  if (st.flow) p.set("flow", st.flow);
  history.replaceState(null, "", "?" + p);
}
document.addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.s) { st.screen = b.dataset.s; st.flow = null; }
  if (b.dataset.f) { st.flow = b.dataset.f; st.step = 0; st.screen = FLOWS.find((f) => f.id === st.flow).steps[0]; }
  if (b.id === "light" || b.id === "dark") st.theme = b.id;
  if (b.id === "contrast") st.contrast = st.contrast === "more" ? "standard" : "more";
  render();
});
$("device").onchange = (e) => { st.device = e.target.value; render(); };
$("state").onchange = (e) => { st.state = e.target.value; render(); };
document.addEventListener("keydown", (e) => {
  const f = FLOWS.find((x) => x.id === st.flow); if (!f) return;
  if (e.key === "ArrowRight") st.step = Math.min(st.step + 1, f.steps.length - 1);
  else if (e.key === "ArrowLeft") st.step = Math.max(st.step - 1, 0); else return;
  st.screen = f.steps[st.step]; render();
});
// Screens can navigate the prototype: parent.postMessage({ go: "habit", state: "default" }, "*")
addEventListener("message", (e) => { if (e.data && e.data.go) { st.screen = e.data.go; st.state = e.data.state || "default"; render(); } });
render();
</script>
</body>
</html>
